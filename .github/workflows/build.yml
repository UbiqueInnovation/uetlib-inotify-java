name: Build
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    name: Build Project
    uses: UbiqueInnovation/uetlib/.github/workflows/mvn-install.yml@cac727ba5634dbb679e6154022f7d24e8cce0ab9 # uetlib#28, repin to v1.1.1 before merge

    secrets: inherit
  verify-linux:
    name: Linux verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          # Pull request builds resolve without Artifactory and must not reuse its Maven cache.
          cache: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && '' || 'maven' }}
          overwrite-settings: false

      - name: Create settings.xml
        if: ${{ github.event_name != 'pull_request' && github.event_name != 'pull_request_target' }}
        uses: s4u/maven-settings-action@4cfd36368400327fd45dcb28f190ae7b85533deb # v4.1.0
        with:
          githubServer: false
          servers: >-
            [
              {
                "id": "ubique-artifactory-virtual",
                "username": "${{ secrets.UB_ARTIFACTORY_USER }}",
                "password": "${{ secrets.UB_ARTIFACTORY_PASSWORD }}"
              }
            ]
          repositories: >-
            [
              {
                "id": "ubique-artifactory-virtual",
                "url": "${{ secrets.UB_ARTIFACTORY_URL }}${{ secrets.UB_ARTIFACTORY_REPO_UBIQUE }}"
              }
            ]

      - name: install g++
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++

      - name: Verify Linux
        run: ./scripts/verify-linux.sh
