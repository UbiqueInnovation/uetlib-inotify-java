name: Build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    name: Build Project
    uses: UbiqueInnovation/uetlib/.github/workflows/mvn-install.yml@8e735f5276f25dd3e279fff24a4ed959f4a58c69 # v1.2.0

    secrets: inherit
  verify-linux:
    name: Linux verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Pushes and pull requests from this repository resolve through Artifactory, so they can build against
      # releases that are not on Central yet. Fork pull requests receive no secrets and resolve from Central.
      - name: Choose Maven repositories
        id: repositories
        env:
          ARTIFACTORY_USER: ${{ secrets.UB_ARTIFACTORY_USER }}
        run: |
          if [[ -z "$ARTIFACTORY_USER" ]]; then
            echo "No Artifactory credentials (e.g. a fork pull request): resolving from Maven Central"
            echo "artifactory=false" >> "$GITHUB_OUTPUT"
          else
            echo "Resolving through Artifactory"
            echo "artifactory=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25.0.5+8.0.LTS'
          # Builds without Artifactory must not restore its cache: Maven rejects cached artifacts recorded from
          # the Artifactory repository ("present, but unavailable"), so they use their own cache below.
          cache: ${{ steps.repositories.outputs.artifactory == 'true' && 'maven' || '' }}
          overwrite-settings: false

      - name: Cache Maven repository for builds without Artifactory
        if: ${{ steps.repositories.outputs.artifactory != 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-pr-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-pr-${{ runner.os }}-

      - name: Create settings.xml
        if: ${{ steps.repositories.outputs.artifactory == 'true' }}
        uses: s4u/maven-settings-action@4cfd36368400327fd45dcb28f190ae7b85533deb # v4.1.0
        with:
          githubServer: false
          servers: >-
            [
              {
                "id": "ubique-artifactory-virtual",
                "username": "${{ secrets.UB_ARTIFACTORY_USER }}",
                "password": "${{ secrets.UB_ARTIFACTORY_PASSWORD }}"
              }
            ]
          repositories: >-
            [
              {
                "id": "ubique-artifactory-virtual",
                "url": "${{ secrets.UB_ARTIFACTORY_URL }}${{ secrets.UB_ARTIFACTORY_REPO_UBIQUE }}"
              }
            ]

      - name: install g++
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++

      - name: Verify Linux
        run: ./scripts/verify-linux.sh
