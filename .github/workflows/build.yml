name: Build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    name: Build Project
    uses: UbiqueInnovation/uetlib/.github/workflows/mvn-install.yml@3280f1bdd7981d9feeae2822518ec66286996cc6 # v0.2.1

    secrets: inherit
  verify-linux:
    name: Linux verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++
      - run: ./scripts/verify-linux.sh
